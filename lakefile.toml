name = "amalgam"
version = "0.1.0"
keywords = ["math", "order-theory", "sheaf-theory", "combinatorics"]
homepage = "https://github.com/typhdotcom/amalgam"
description = "A formal theory of restriction, compatibility, and global extension"
license = "Apache-2.0"
licenseFiles = ["LICENSE"]
defaultTargets = ["Amalgam"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Amalgam"
